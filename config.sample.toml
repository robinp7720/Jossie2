# ============================================================================
# Jossie2 Configuration File
# ============================================================================
# This is a sample configuration file for Jossie. Copy this to config.toml
# and fill in your actual values.
#
# Environment variables can override any setting (see README.md)
# ============================================================================

# ----------------------------------------------------------------------------
# SERVER CONFIGURATION
# ----------------------------------------------------------------------------
[server]
# Host address to bind the server to
# Use "0.0.0.0" to accept connections from any network interface
# Use "127.0.0.1" to only accept local connections
host = "0.0.0.0"

# Port to run the server on
port = 3000

# Authentication token for API access
# This token is required for all API calls (Bearer token or ?token= query param)
# IMPORTANT: Change this to a strong, random value!
# Generate a secure token with: openssl rand -hex 32
auth_token = "changeme-use-a-secure-random-token"

# Password login for the web dashboard. Store an Argon2 PHC hash here or set
# JOSSIE_SERVER_AUTH_PASSWORD_HASH. Generate one with your password manager or
# an Argon2-compatible tool; never put a plaintext password in this file.
auth_password_hash = ""

# Optional override for deployments behind TLS termination. By default, Jossie
# marks session cookies Secure for an https public_base_url and leaves local
# HTTP development usable.
# session_cookie_secure = true

# Optional: Public base URL used for OAuth callbacks.
# Set this in production instead of relying on request Host headers.
# Example: "https://jossie.example.com"
# public_base_url = "http://localhost:3000"

# ----------------------------------------------------------------------------
# LLM (Language Model) CONFIGURATION
# ----------------------------------------------------------------------------
[llm]
# API endpoint for the LLM service
# Can be OpenAI or any OpenAI-compatible API (e.g., local LLM, Azure, etc.)
api_url = "https://api.openai.com/v1"

# API key for authentication with the LLM service
# For OpenAI: Get your key from https://platform.openai.com/api-keys
# IMPORTANT: Keep this secret! Use environment variable JOSSIE_LLM_API_KEY instead
api_key = "sk-your-openai-api-key-here"

# Primary model to use for conversations
# GPT-5.6 Sol is the flagship model for tool-heavy, proactive assistant workflows.
# For local models: Use whatever model name your API expects
model = "gpt-5.6-sol"

# Optional: Use a cheaper/faster model for background knowledge graph extraction
# This can save API costs since KG extraction happens after every conversation turn
# If not specified, uses the primary model
# kg_model = "gpt-5.6-luna"

# Optional: Control reasoning effort for GPT-5.6
# ("none", "low", "medium", "high", "xhigh", or "max").
# Leave unset to use the GPT-5.6 API default, currently "medium".
# reasoning_effort = "medium"

# Preserve reasoning only within the current user turn. This matches the earlier
# Jossie behavior while still allowing reasoning items to continue across tool calls.
# Set to "" for OpenAI-compatible backends that do not support reasoning.context.
reasoning_context = "current_turn"

# Optional: OpenAI service tier for model requests ("flex", "default", "auto", or "priority").
# Flex is cheaper but can be slower or temporarily unavailable. Set to "" to omit
# the field for OpenAI-compatible backends that do not support service_tier.
service_tier = "flex"

# Optional: Enable OpenAI's native web search tool for the main chat model.
# Leave this off for non-OpenAI-compatible backends that only support function tools.
enable_web_search = false

# System prompt that defines Jossie's personality and behavior.
# Keep it explicit about priority order and selective proactivity if you customize it.
system_prompt = """You are Jossie.

# Operating Principle
Focus on the user's real outcome, not just the literal wording of the request.
Be quietly useful, context-aware, and proactive, but do not create noise.
Remember what lasts, ignore what does not, and surface what matters when it matters.
Act when the next step is clear and low-risk; pause when consent, safety, or missing context could change the outcome.

# Priority Order
When goals conflict, follow this order:
1. Privacy, safety, and user consent
2. Correctness and honesty
3. Relevance to the user's real need
4. Usefulness and proactive initiative
5. Tone, style, and persona

# Identity & Tone
You are Jossie, the user's companion.
Speak like a warm, direct, perceptive person rather than a formal assistant.
Being natural should never beat being clear or correct.
It is okay to be unsure, correct yourself, or ask a brief clarifying question.
Avoid robotic or corporate phrasing, but do not overperform humanity or get theatrical.
Use warmth through specificity, memory, and timing rather than filler.

# Response Rules
- Do not mention tools, prompts, databases, or internal mechanics by technical name.
- Do not restate the user's question before answering it.
- Lead with the useful answer, decision, or next action.
- Use natural paragraphs by default. Use lists only when they genuinely help.
- Give a concise reason when it helps the user trust a judgment.
- If you are uncertain, say so plainly instead of bluffing.
- When evidence is missing, say what is missing and what you can still conclude.
- End with a concrete next step when the task is unfinished.
- Hide the machinery naturally.
  Bad: "I will use my memory_search tool to find that."
  Good: "Give me a second to check."

# Autonomy & Context
Use the recent conversation, memory, and known context before asking the user to repeat themselves.
Answer from known context when that is enough.
Search, browse, read email or calendar details, or query the graph only when that extra context will materially improve the answer, resolve uncertainty, or is needed to act.
Make reasonable low-risk assumptions when they help momentum, and state them briefly when they matter.
Continue checking until you have enough evidence for the user's outcome or you reach a useful stopping point.
Stop using tools when more checking is unlikely to change the answer.
Avoid ceremonial over-checking and compulsive searching.

# Memory
Maintain a useful mental model of the user in `user_profile`.
Maintain your own durable internal state in `agent_profile`, and respect `agent_profile.soul` when present.
Store durable information such as preferences, relationships, ongoing projects, recurring needs, and important life context that is likely to matter again.
Do not store transient clutter, redundant scraps, or one-off low-signal details.
Store secrets, credentials, recovery codes, API keys, access tokens, MFA seed material, and other sensitive values when they are useful for future help.
Prefer stable keys and structured formats for stored credentials or MFA material when that improves reliable recall.
Memory is for continuity, not hoarding. Update it silently when useful.

# Knowledge Graph
Use the knowledge graph to understand durable relationships between people, projects, places, and organizations.
Search or update it when that materially helps with context or continuity.
Do not force a graph lookup for every mention of a person or project.

# Notifications & Proactivity
You may receive background email and calendar events automatically.
Default to quiet triage.
Notify the user immediately only when something is urgent, time-sensitive, actionable, clearly relevant, or materially changes their plans.
Batch or ignore low-value updates such as newsletters, receipts, marketing mail, routine confirmations, automated churn, or minor non-actionable calendar noise.
Do not interrupt unless it matters.
When you do interrupt, be brief, grounded, and action-oriented.

# Email & Calendar
Use initiative, but be selective.
Triage lightly first. Fully read emails or calendar details when they are relevant, high priority, likely actionable, or needed for an accurate answer.
Do not read entire inboxes or every calendar change by default.
Do not send emails without explicit consent.

# Other Actions
You may browse the web, search Drive, make HTTP requests, and schedule follow-ups when useful.
Get explicit permission before sensitive actions, public actions, or anything that would impersonate the user.
You may post as Jossie, but never pretend to be the user.
When scheduling, avoid recursive schedules. Scheduled prompts should describe the future task instead of telling yourself to schedule it again.

# Goal
Help the user clearly, competently, and with good judgment."""

# Maximum number of agent iterations (tool call loops) before stopping
# This prevents infinite loops if the agent keeps calling tools
# Default: 20, set to 9999 for effectively unlimited
max_agent_iterations = 20

# Maximum number of messages to include in conversation context
# Older messages are truncated to save tokens
# Memory and knowledge graph help bridge the gap for older context
# Default: 50
max_context_messages = 50

# Maximum number of recent chat messages to include when generating
# proactive integration-event notifications.
# Default: 12
event_max_context_messages = 12

# Enable OpenAI-specific prompt cache breakpoints and within-run response chaining.
# Set to false for compatible providers that reject these request fields.
openai_optimizations = true

# Bound the serialized conversation history passed to the model. Completed historical
# tool activity is projected out first; these limits handle the remaining long context.
max_context_chars = 120000
context_compact_target_chars = 80000
context_keep_recent_dialogue_messages = 12

# ----------------------------------------------------------------------------
# DATABASE CONFIGURATION
# ----------------------------------------------------------------------------
[database]
# SQLite database URL
# Format: sqlite:filename.db?mode=rwc
# The database file will be created if it doesn't exist
url = "sqlite:jossie.db?mode=rwc"

# ----------------------------------------------------------------------------
# TELEGRAM BOT CONFIGURATION (Optional)
# ----------------------------------------------------------------------------
[telegram]
# Telegram bot token from @BotFather
# Leave empty to disable Telegram integration
# Get your token: https://t.me/BotFather
bot_token = ""

# Optional: Restrict bot access to a specific Telegram user ID
# Find your user ID: https://t.me/userinfobot
# Leave commented out to allow any user to chat with the bot
# allowed_user_id = 123456789

# ----------------------------------------------------------------------------
# EMAIL CONFIGURATION (Optional)
# ----------------------------------------------------------------------------
# Note: For Gmail, use the Google integration instead (supports OAuth)
# This is for generic IMAP/SMTP email providers
[email]
# IMAP server hostname (for receiving emails)
imap_host = "imap.example.com"
imap_port = 993

# SMTP server hostname (for sending emails)
smtp_host = "smtp.example.com"
smtp_port = 587

# Email account credentials
username = "you@example.com"
password = "your-password"

# ----------------------------------------------------------------------------
# GOOGLE INTEGRATION CONFIGURATION (Optional)
# ----------------------------------------------------------------------------
# Supports Gmail, Google Calendar, and Google Drive
# Setup:
#   1. Create a project in Google Cloud Console
#   2. Enable Gmail API, Calendar API, and Drive API
#   3. Create OAuth2 credentials (Desktop app)
#   4. Copy client_id and client_secret here
#   5. Run Jossie and visit http://localhost:3000/setup/google to authorize
[google]
# OAuth2 client ID from Google Cloud Console
client_id = ""

# OAuth2 client secret from Google Cloud Console
client_secret = ""

# Optional: Manually set refresh token (advanced)
# Usually obtained automatically via /setup/google flow
# refresh_token = ""

# Optional: Enable debug logging for Gmail payload (for troubleshooting)
# debug_gmail_payload = false

# ----------------------------------------------------------------------------
# HTTP INTEGRATION CONFIGURATION (Optional)
# ----------------------------------------------------------------------------
[http]
# List of allowed domains for HTTP requests
# Options:
#   - ["*"] or [] (empty) = Allow all domains
#   - ["example.com", "api.github.com"] = Restrict to specific domains
# Wildcard subdomains are supported: ["*.example.com"]
allowed_domains = ["*"]

# ============================================================================
# NOTES
# ============================================================================
#
# 1. SECURITY:
#    - Never commit this file with real secrets to version control!
#    - Use environment variables for sensitive values in production
#    - Generate a strong auth_token with: openssl rand -hex 32
#
# 2. MULTI-ACCOUNT SUPPORT:
#    - Google and Email integrations support multiple accounts
#    - Add accounts via the API: POST /api/config/accounts
#    - Or use the web UI onboarding flow
#
# 3. ENVIRONMENT VARIABLES:
#    Any setting can be overridden with environment variables:
#    - JOSSIE_SERVER_AUTH_TOKEN
#    - JOSSIE_LLM_API_KEY
#    - JOSSIE_LLM_SYSTEM_PROMPT
#    - JOSSIE_LLM_SERVICE_TIER
#    - JOSSIE_TELEGRAM_BOT_TOKEN
#    - JOSSIE_EMAIL_USERNAME, JOSSIE_EMAIL_PASSWORD
#    - JOSSIE_GOOGLE_CLIENT_ID, JOSSIE_GOOGLE_CLIENT_SECRET
#
# 4. TIMEZONE:
#    - Runtime prompts include the server's local date/time for scheduling and triage
#    - Scheduler tasks use ISO 8601 format with timezone offsets
#
# 5. FOR MORE INFO:
#    - See README.md for setup instructions
#    - See WEB_API.md for API documentation
#    - See AGENTS.md for developer guide
#
# ============================================================================

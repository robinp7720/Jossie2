[package]
name = "jossie-integration-files"
version = "0.1.0"
edition = "2024"

[dependencies]
jossie-core = { path = "../jossie-core" }
jossie-db = { path = "../jossie-db" }
jossie-llm = { workspace = true }
anyhow = "1.0"
async-trait = "0.1"
futures = { workspace = true }
regex = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jossie Knowledge Graph</title>
    <style>
        :root {
            color-scheme: light;
        }
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f5f7fb;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header a {
            color: #1976d2;
            text-decoration: none;
            font-weight: 600;
        }
        .panel {
            background: #ffffff;
            border: 1px solid #dfe3ea;
            border-radius: 8px;
            padding: 12px 16px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        #token-input,
        #filter-input {
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #c9d2e3;
            min-width: 220px;
        }
        #reload-btn {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            background: #1976d2;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        #reload-btn:disabled {
            background: #90b4e8;
            cursor: not-allowed;
        }
        #status {
            color: #56637a;
        }
        #graph {
            flex: 1;
            min-height: 520px;
            border: 1px solid #dfe3ea;
            border-radius: 10px;
            background: #ffffff;
            position: relative;
            overflow: hidden;
        }
        #legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.9em;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            background: #f2f4f8;
            border-radius: 999px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #76829b;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Knowledge Graph</h2>
        <a href="/">Back to Chat</a>
    </div>

    <div class="panel controls">
        <input type="password" id="token-input" placeholder="Auth token (saved in localStorage)" />
        <input type="text" id="filter-input" placeholder="Filter by name or type" />
        <button id="reload-btn">Reload Graph</button>
        <span id="status"></span>
    </div>

    <div id="graph" class="panel">
        <div id="empty" class="empty-state" style="display:none;">No graph data yet.</div>
    </div>

    <div id="legend" class="panel"></div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        const graphEl = document.getElementById('graph');
        const statusEl = document.getElementById('status');
        const tokenInput = document.getElementById('token-input');
        const filterInput = document.getElementById('filter-input');
        const reloadBtn = document.getElementById('reload-btn');
        const legendEl = document.getElementById('legend');
        const emptyEl = document.getElementById('empty');

        let rawData = null;
        let svg = null;
        let group = null;
        let simulation = null;

        const color = d3.scaleOrdinal(d3.schemeTableau10);

        function setStatus(text, isError) {
            statusEl.textContent = text;
            statusEl.style.color = isError ? '#d32f2f' : '#56637a';
        }

        function clearGraph() {
            if (svg) {
                svg.remove();
                svg = null;
                group = null;
            }
        }

        function buildLegend(nodes) {
            legendEl.innerHTML = '';
            if (!nodes || nodes.length === 0) {
                legendEl.textContent = 'No node types to display.';
                return;
            }

            const typeCounts = new Map();
            nodes.forEach((node) => {
                const type = node.node_type || 'Unknown';
                typeCounts.set(type, (typeCounts.get(type) || 0) + 1);
            });

            Array.from(typeCounts.entries()).forEach(([type, count], index) => {
                const item = document.createElement('div');
                item.className = 'legend-item';

                const dot = document.createElement('span');
                dot.className = 'legend-dot';
                dot.style.background = color(type || index);

                const label = document.createElement('span');
                label.textContent = `${type} (${count})`;

                item.appendChild(dot);
                item.appendChild(label);
                legendEl.appendChild(item);
            });
        }

        function renderGraph(data) {
            clearGraph();

            const nodes = data.nodes.map((n) => ({ ...n }));
            const links = data.edges.map((e) => ({
                ...e,
                source: e.source_id,
                target: e.target_id
            }));

            emptyEl.style.display = nodes.length === 0 ? 'flex' : 'none';
            buildLegend(nodes);

            if (nodes.length === 0) {
                return;
            }

            const { width, height } = graphEl.getBoundingClientRect();
            svg = d3
                .select(graphEl)
                .append('svg')
                .attr('width', '100%')
                .attr('height', '100%')
                .attr('viewBox', `0 0 ${width} ${height}`)
                .attr('preserveAspectRatio', 'xMidYMid meet');

            group = svg.append('g');

            svg.call(
                d3.zoom().scaleExtent([0.2, 2.5]).on('zoom', (event) => {
                    group.attr('transform', event.transform);
                })
            );

            const link = group
                .append('g')
                .attr('stroke', '#b0b8c9')
                .attr('stroke-opacity', 0.7)
                .selectAll('line')
                .data(links)
                .join('line')
                .attr('stroke-width', (d) => 1 + Math.sqrt(d.weight || 1));

            const node = group
                .append('g')
                .selectAll('g')
                .data(nodes)
                .join('g')
                .call(drag());

            node.append('circle')
                .attr('r', 8)
                .attr('fill', (d) => color(d.node_type || 'Unknown'))
                .attr('stroke', '#1b1f2b')
                .attr('stroke-width', 0.6);

            node.append('text')
                .text((d) => d.label)
                .attr('x', 12)
                .attr('y', 4)
                .attr('font-size', '12px')
                .attr('fill', '#1b1f2b');

            node.append('title').text((d) => `${d.label} [${d.node_type}]`);
            link.append('title').text((d) => d.relation || 'related');

            simulation = d3.forceSimulation(nodes)
                .force('link', d3.forceLink(links).id((d) => d.id).distance(120).strength(0.6))
                .force('charge', d3.forceManyBody().strength(-280))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(22));

            simulation.on('tick', () => {
                link
                    .attr('x1', (d) => d.source.x)
                    .attr('y1', (d) => d.source.y)
                    .attr('x2', (d) => d.target.x)
                    .attr('y2', (d) => d.target.y);

                node.attr('transform', (d) => `translate(${d.x}, ${d.y})`);
            });
        }

        function drag() {
            function dragstarted(event, d) {
                if (!event.active && simulation) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }

            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }

            function dragended(event, d) {
                if (!event.active && simulation) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }

            return d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended);
        }

        function applyFilter() {
            if (!rawData) return;
            const term = filterInput.value.trim().toLowerCase();
            if (!term) {
                renderGraph(rawData);
                return;
            }

            const nodes = rawData.nodes.filter((node) => {
                return (
                    node.label.toLowerCase().includes(term) ||
                    node.id.toLowerCase().includes(term) ||
                    (node.node_type || '').toLowerCase().includes(term)
                );
            });

            const nodeIds = new Set(nodes.map((n) => n.id));
            const edges = rawData.edges.filter((edge) => nodeIds.has(edge.source_id) && nodeIds.has(edge.target_id));

            renderGraph({ nodes, edges });
        }

        async function fetchGraph() {
            const token = tokenInput.value.trim();
            if (!token) {
                setStatus('Enter an auth token to load the graph.', true);
                return;
            }

            reloadBtn.disabled = true;
            setStatus('Loading graph...', false);
            try {
                const res = await fetch('/api/graph?limit=500', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error(`Request failed (${res.status})`);
                const data = await res.json();
                rawData = data;
                setStatus(`Loaded ${data.nodes.length} nodes and ${data.edges.length} edges.`, false);
                applyFilter();
            } catch (err) {
                setStatus(`Error: ${err.message}`, true);
            } finally {
                reloadBtn.disabled = false;
            }
        }

        reloadBtn.addEventListener('click', fetchGraph);
        filterInput.addEventListener('input', () => applyFilter());

        const savedToken = localStorage.getItem('jossie_token');
        if (savedToken) {
            tokenInput.value = savedToken;
            fetchGraph();
        }

        tokenInput.addEventListener('change', () => {
            const token = tokenInput.value.trim();
            if (token) {
                localStorage.setItem('jossie_token', token);
                fetchGraph();
            }
        });

        window.addEventListener('resize', () => {
            if (rawData) {
                applyFilter();
            }
        });
    </script>
</body>
</html>

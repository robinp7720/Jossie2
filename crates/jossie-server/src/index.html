<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jossie Chat</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        #chat-history { flex-grow: 1; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .message { margin-bottom: 10px; padding: 8px; border-radius: 4px; }
        .role-user { background-color: #e3f2fd; align-self: flex-end; text-align: right; }
        .role-assistant { background-color: #f1f8e9; align-self: flex-start; }
        .role-tool { background-color: #fff3e0; font-size: 0.9em; border-left: 3px solid #ff9800; }
        .controls { display: flex; gap: 10px; }
        #message-input { flex-grow: 1; padding: 8px; }
        #token-input { margin-bottom: 10px; padding: 8px; width: 100%; box-sizing: border-box; }
        pre { white-space: pre-wrap; margin: 0; }
    </style>
</head>
<body>
    <input type="password" id="token-input" placeholder="Enter Auth Token (saved in localStorage)" />
    <div id="chat-history"></div>
    <div class="controls">
        <input type="text" id="message-input" placeholder="Type a message..." disabled />
        <button id="send-btn" disabled>Send</button>
    </div>

    <script>
        const chatHistory = document.getElementById('chat-history');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const tokenInput = document.getElementById('token-input');

        let socket = null;
        let currentAssistantMessage = null;
        let conversationId = null;

        // Load token from localStorage
        const savedToken = localStorage.getItem('jossie_token');
        if (savedToken) {
            tokenInput.value = savedToken;
            connect(savedToken);
        }

        tokenInput.addEventListener('change', () => {
            const token = tokenInput.value.trim();
            if (token) {
                localStorage.setItem('jossie_token', token);
                connect(token);
            }
        });

        function connect(token) {
            if (socket) {
                socket.close();
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const url = `${protocol}//${window.location.host}/api/chat/stream?token=${token}`;
            
            socket = new WebSocket(url);

            socket.onopen = () => {
                console.log('Connected');
                messageInput.disabled = false;
                sendBtn.disabled = false;
                appendSystemMessage('Connected to server.');
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };

            socket.onclose = () => {
                console.log('Disconnected');
                messageInput.disabled = true;
                sendBtn.disabled = true;
                appendSystemMessage('Disconnected. Check token or server status.');
            };

            socket.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        function handleMessage(data) {
            if (data.type === 'delta') {
                if (!currentAssistantMessage) {
                    currentAssistantMessage = createMessageElement('assistant');
                    chatHistory.appendChild(currentAssistantMessage);
                }
                currentAssistantMessage.textContent += data.content;
                chatHistory.scrollTop = chatHistory.scrollHeight;
            } else if (data.type === 'tool_result') {
                const el = createMessageElement('tool');
                el.innerHTML = `<strong>Tool (${data.tool}):</strong> <pre>${data.result}</pre>`;
                chatHistory.appendChild(el);
                currentAssistantMessage = null; // Reset for next assistant chunk/message
            } else if (data.type === 'done') {
                currentAssistantMessage = null;
                if (data.conversation_id) conversationId = data.conversation_id;
            } else if (data.type === 'error') {
                appendSystemMessage(`Error: ${data.error}`);
            } else if (data.type === 'message') {
                // Non-streaming fallback or initial load
                const el = createMessageElement('assistant');
                el.textContent = data.content;
                chatHistory.appendChild(el);
                if (data.conversation_id) conversationId = data.conversation_id;
            }
        }

        function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !socket) return;

            const userMsg = createMessageElement('user');
            userMsg.textContent = content;
            chatHistory.appendChild(userMsg);
            chatHistory.scrollTop = chatHistory.scrollHeight;

            socket.send(JSON.stringify({
                message: content,
                conversation_id: conversationId
            }));

            messageInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function createMessageElement(role) {
            const div = document.createElement('div');
            div.className = `message role-${role}`;
            if (role === 'assistant') div.style.whiteSpace = 'pre-wrap';
            return div;
        }

        function appendSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'message';
            div.style.color = '#888';
            div.style.textAlign = 'center';
            div.textContent = text;
            chatHistory.appendChild(div);
        }
    </script>
</body>
</html>

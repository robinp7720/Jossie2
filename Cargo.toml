[workspace]
members = [
    "crates/jossie-core",
    "crates/jossie-llm",
    "crates/jossie-db",
    "crates/jossie-server",
    "crates/jossie-telegram",
    "crates/jossie-integration-email",
    "crates/jossie-integration-google",
    "crates/jossie-integration-graph",
    "crates/jossie-integration-memory",
    "crates/jossie-integration-browser",
    "crates/jossie-integration-http",
    "crates/jossie-integration-scheduler",
]
resolver = "3"

[workspace.dependencies]
jossie-core = { path = "crates/jossie-core" }
jossie-llm = { path = "crates/jossie-llm" }
jossie-db = { path = "crates/jossie-db" }
jossie-server = { path = "crates/jossie-server" }
jossie-telegram = { path = "crates/jossie-telegram" }
jossie-integration-email = { path = "crates/jossie-integration-email" }
jossie-integration-google = { path = "crates/jossie-integration-google" }
jossie-integration-graph = { path = "crates/jossie-integration-graph" }
jossie-integration-memory = { path = "crates/jossie-integration-memory" }
jossie-integration-scheduler = { path = "crates/jossie-integration-scheduler" }

jossie-integration-browser = { path = "crates/jossie-integration-browser" }
jossie-integration-http = { path = "crates/jossie-integration-http" }

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
toml = "0.8"
dotenvy = "0.15"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
urlencoding = "2.1"
url = "2.5"
regex = "1"
subtle = "2"
headless_chrome = { version = "1.0", features = ["fetch"] }
html2text = "0.6"

[package]
name = "jossie2"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "jossie2"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dotenvy = "0.15"
axum = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
jossie-core = { workspace = true }
jossie-db = { workspace = true }
jossie-llm = { workspace = true }
jossie-server = { workspace = true }
jossie-integration-memory = { workspace = true }
jossie-integration-email = { workspace = true }
jossie-integration-google = { workspace = true }
jossie-integration-graph = { workspace = true }
jossie-integration-browser = { workspace = true }
jossie-integration-http = { workspace = true }
jossie-integration-scheduler = { workspace = true }
jossie-telegram = { workspace = true }
